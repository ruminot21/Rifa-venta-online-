<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifa Online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#07111f;color:#eef4ff}.wrap{max-width:1180px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#111c30,#0b172a);border:1px solid #263854;border-radius:22px;padding:22px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:clamp(28px,5vw,44px)}.muted{color:#9fb0c8}.sync{font-size:12px;margin-top:8px}.media{background:#111c30;border:1px solid #263854;border-radius:22px;padding:16px;margin-bottom:18px}.media-stage{position:relative;overflow:hidden;border-radius:16px;background:#050914;min-height:220px;display:grid;place-items:center}.media-stage img,.media-stage video{width:100%;max-height:460px;object-fit:contain}.media-controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}.media-controls button{border:1px solid #263854;background:#16243b;color:white;border-radius:10px;padding:9px 13px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 330px;gap:18px}.card{background:#111c30;border:1px solid #263854;border-radius:20px;padding:20px}.numbers{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;max-height:590px;overflow:auto}.num{height:48px;border-radius:12px;border:1px solid #263854;background:#0c172a;color:white;font-weight:800;cursor:pointer}.num.selected{background:#21d4a3;color:#03111b}.num.busy{background:#263238;color:#8fa0ae;cursor:not-allowed}.legend{font-size:12px;color:#9fb0c8;margin:8px 0 14px}.selected{font-weight:800}.summary{background:#0c172a;border-radius:14px;padding:14px;margin:12px 0}.total{font-size:27px;font-weight:900;margin:10px 0}input{width:100%;padding:12px;margin:5px 0 10px;border-radius:10px;border:1px solid #263854;background:#081326;color:white}.pay{width:100%;padding:14px;border:0;border-radius:12px;background:#21d4a3;color:#03111b;font-weight:900;cursor:pointer}.pay:disabled{opacity:.5}.msg{margin-top:12px;padding:10px;border-radius:10px;background:#10243b}.empty{text-align:center;padding:30px;color:#9fb0c8}@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<section class="hero"><h1 id="raffleName">Rifa Online</h1><div class="muted">Selecciona tus números y paga con Mercado Pago.</div><div class="sync" id="sync">Conectando…</div></section>
<section class="media" id="mediaBox" hidden><h2>🏆 Premios</h2><div class="media-stage" id="mediaStage"></div><div class="media-controls"><button id="prev">‹ Anterior</button><span id="mediaCounter"></span><button id="next">Siguiente ›</button></div></section>
<div class="grid"><section class="card"><h2>Elige tus números</h2><div class="legend">🟢 Disponible · 🔵 Seleccionado · 🔴 Vendido/pendiente</div><div class="numbers" id="numbers"></div></section>
<section class="card"><h2>Datos del comprador</h2><input id="name" placeholder="Nombre completo"><input id="email" type="email" placeholder="Correo electrónico"><input id="phone" placeholder="WhatsApp / teléfono"><input id="rut" placeholder="RUT"><div class="summary">Seleccionados: <span id="selected">Ninguno</span><div class="total" id="total">$0</div></div><button class="pay" id="pay">Pagar con Mercado Pago</button><div class="msg muted" id="msg">Selecciona tus números.</div></section></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import {getFirestore,doc,onSnapshot} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyAiw9ZFZtNPMPbfpKYRGJgkP8B9QCdaSxY",authDomain:'rifa-online-12032.firebaseapp.com',projectId:'rifa-online-12032',storageBucket:'rifa-online-12032.firebasestorage.app',messagingSenderId:'202533148482',appId:'1:202533148482:web:70e1df07c78d49af455adb'};
const db=getFirestore(initializeApp(firebaseConfig)); const ref=doc(db,'rifas','rifa_principal'); let state={totalNumbers:100,ticketValue:1000,raffleName:'Rifa Online',participants:[],prizeImages:[],prizeVideo:''}; let selected=[];let mediaIndex=0;
const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);
const pad=n=>String(n).padStart(3,'0');
function busy(){return new Set((state.participants||[]).flatMap(p=>Array.isArray(p.numbers)?p.numbers:[]))}
function render(){document.querySelector('#raffleName').textContent=state.raffleName||'Rifa Online';let b=busy();selected=selected.filter(n=>!b.has(n));const box=document.querySelector('#numbers');box.innerHTML='';for(let i=1;i<=state.totalNumbers;i++){let x=document.createElement('button');x.className='num';x.textContent=pad(i);if(b.has(i)){x.classList.add('busy');x.disabled=true}else if(selected.includes(i))x.classList.add('selected');x.onclick=()=>{selected=selected.includes(i)?selected.filter(n=>n!==i):[...selected,i];render()};box.appendChild(x)}document.querySelector('#selected').textContent=selected.length?selected.map(pad).join(', '):'Ninguno';document.querySelector('#total').textContent=money(selected.length*state.ticketValue);renderMedia()}
function renderMedia(){const imgs=state.prizeImages||[];const video=state.prizeVideo||'';const items=[...imgs.map(url=>({type:'img',url})),...(video?[{type:'video',url:video}]:[])];const box=document.querySelector('#mediaBox');const stage=document.querySelector('#mediaStage');if(!items.length){box.hidden=true;return}box.hidden=false;if(mediaIndex>=items.length)mediaIndex=0;stage.innerHTML='';const it=items[mediaIndex];if(it.type==='img'){let img=document.createElement('img');img.src=it.url;img.alt='Premio';stage.appendChild(img)}else{let v=document.createElement('video');v.src=it.url;v.controls=true;v.autoplay=false;v.playsInline=true;stage.appendChild(v)}document.querySelector('#mediaCounter').textContent=`${mediaIndex+1} / ${items.length}`}
document.querySelector('#prev').onclick=()=>{let n=(state.prizeImages||[]).length+(state.prizeVideo?1:0);mediaIndex=(mediaIndex-1+n)%n;renderMedia()};document.querySelector('#next').onclick=()=>{let n=(state.prizeImages||[]).length+(state.prizeVideo?1:0);mediaIndex=(mediaIndex+1)%n;renderMedia()};
onSnapshot(ref,s=>{if(s.exists()){state={...state,...s.data()};document.querySelector('#sync').textContent='🟢 En línea · datos actualizados en tiempo real';document.querySelector('#sync').style.color='#86efac';render()}},e=>{document.querySelector('#sync').textContent='🔴 No se pudo conectar a la rifa';document.querySelector('#sync').style.color='#fda4af';document.querySelector('#msg').textContent='Revisa las reglas de lectura de Firestore.'});
document.querySelector('#pay').onclick=async()=>{const name=document.querySelector('#name').value.trim(),email=document.querySelector('#email').value.trim();if(!name||!email||!selected.length){document.querySelector('#msg').textContent='Completa nombre, correo y selecciona números.';return}document.querySelector('#pay').disabled=true;document.querySelector('#msg').textContent='Reservando números y creando pago…';try{const r=await fetch('/api/create-preference',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone:document.querySelector('#phone').value.trim(),rut:document.querySelector('#rut').value.trim(),numbers:selected})});const d=await r.json();if(!r.ok)throw Error(d.error||'No fue posible crear el pago');location.href=d.init_point}catch(e){document.querySelector('#msg').textContent=e.message;document.querySelector('#pay').disabled=false}};
render();
</script></body></html>
